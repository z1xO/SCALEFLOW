name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please do **not** report security vulnerabilities here - see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the request id (`x-request-id` header / `requestId` in error responses) if you have one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, API calls (redact API keys), job payloads.
      placeholder: |
        1. docker compose up -d
        2. curl -X POST ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [API, Worker, Relay, Scheduler, Dashboard, Docker / deployment, Docs]
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: JSON log lines from the affected processes. Remove secrets and payloads.
      render: shell
