name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could ScaleFlow solve it? Consider consistency, failure modes and operational cost.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
