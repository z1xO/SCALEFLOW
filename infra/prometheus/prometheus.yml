global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ['api:4000']

  # Workers are scaled with `--scale worker=N`; Docker DNS returns one A record per replica.
  - job_name: worker
    dns_sd_configs:
      - names: ['worker']
        type: A
        port: 9465
        refresh_interval: 15s

  - job_name: relay
    static_configs:
      - targets: ['relay:9466']

  - job_name: scheduler
    static_configs:
      - targets: ['scheduler:9467']
